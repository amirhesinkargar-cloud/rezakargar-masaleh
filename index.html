<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خرید مصالح ساختمانی | کارگر</title>
    <link rel="stylesheet" href="style.css">
    <!-- لینک به فونت (مثلا وزیرمتن) -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
</head>
<body>

    <!-- هدر بالای صفحه -->
    <header class="main-header">
        <button class="icon-btn"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 6h18M3 12h18M3 18h18"></path></svg></button>
        <div class="logo">
            <!-- اینجا لوگوی خودت رو بذار -->
            <img src="images/logo.png" alt="لوگو کارگر" style="height: 40px;">
        </div>
        <button class="cart-btn">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        </button>
    </header>

    <!-- بخش اصلی (هیرو سکشن) -->
    <main class="hero-section">
        <div class="hero-image-container">
            <!-- عکس کامیون یا انبار -->
            <img src="images/truck.jpg" alt="انبار مصالح" class="hero-img">
            
            <!-- دکمه‌های چپ و راست اسلایدر (ظاهری) -->
            <button class="slider-arrow right">&#10095;</button>
            <button class="slider-arrow left">&#10094;</button>

            <!-- باکس متن روی عکس -->
            <div class="hero-overlay">
                <h2>خرید پروژه‌ای بدون آشفتگی</h2>
                <p>آدرس پروژه، نوع پرداخت و ظرفیت حمل را یکجا مدیریت کنید.</p>
            </div>
        </div>

        <!-- متن‌های زیر عکس -->
        <div class="sub-hero">
            <span class="badge">تأمین مستقیم مصالح</span>
            <p>برای خرید روزمره و پروژه‌های ساختمانی</p>
        </div>

        <h1 class="main-title">
            مصالح ساختمانی <span class="highlight">قابل اعتماد</span><br>
            با قیمت شفاف و ارسال سریع
        </h1>
    </main>

    <!-- منوی پایین (فقط در موبایل دیده میشه) -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>صفحه اصلی</span>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <span>جستجو</span>
        </a>
        <a href="#" class="nav-item cart-nav">
            <div class="cart-circle">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="white" stroke-width="2" fill="none"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            </div>
            <span class="cart-text">سبد خرید</span>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span>دسته‌بندی</span>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>پروفایل</span>
        </a>
    </nav>

</body>
</html>
